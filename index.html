<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="header-container">
      <div class="logo">
        <a href="#" id="homeIcon">
          <img src="https://via.placeholder.com/30" alt="Home Icon" class="home-icon"> Restaurant Name
        </a>
      </div>
      <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search for dishes...">
      </div>
      <div class="action-icons">
        <button type="button" id="viewWishlist"><i class="fas fa-heart"></i>&#10084;</button>
        <button type="button" id="viewCart"><i class="fas fa-shopping-cart"></i> View Cart</button>
      </div>
    </div>
  </header>

  <!-- Filter Section -->
  <section class="filters">
    <button type="button" class="filter-btn" data-filter="all">All</button>
    <button type="button" class="filter-btn" data-filter="vegetarian">Vegetarian</button>
    <button type="button" class="filter-btn" data-filter="gluten-free">Gluten-Free</button>
    <button type="button" class="filter-btn" data-filter="spicy">Spicy</button>
    <button type="button" class="filter-btn" data-filter="seafood">Seafood</button>
    <button type="button" class="filter-btn" data-filter="dairy-free">Dairy-Free</button>
  </section>

  <main>
    <!-- Generate 15 Categories Dynamically -->
    <div id="menu">
      <script>
        const categories = ["Appetizers", "Soups", "Salads", "Main Courses", "Pasta", "Pizza", "Seafood", "Grilled", "Vegetarian", "Desserts", "Beverages", "Kids Menu", "Breakfast", "Specials", "Sides"];
        const categoryDescriptions = [
  ...(() => {
    const descriptions = [];
    for (let i = 0; i < 150; i++) {
      descriptions.push("Descriptions "+i);
    }
    return descriptions;
  })()
];

const imageUrls = [
  ...(() => {
    const urls = [];
    for (let i = 0; i < 150; i++) {
      urls.push("https://via.placeholder.com/150"); // Constant URL for each item
    }
    return urls;
  })()
];

const pricesList = [
  ...(() => {
    const prices = [];
    for (let i = 0; i < 150; i++) {
      prices.push(5.99); // Constant price for each item
    }
    return prices;
  })()
];
        const dishNames = [
    ...(() => {
        const dishes = [];
        for (let i = 1; i <= 150; i++) {
            dishes.push(`Dish ${i}`);
        }
        return dishes;
    })()
];
        const filterMapping = [
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"],
          ["vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free", "vegetarian", "gluten-free", "spicy", "seafood", "dairy-free"]
        ];
        const dishesPerCategory = [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10];
        let constant = -1 , constants = 0;

        const dishes = categories.map((category, i) => {
  return `
    <section class="menu-category" id="category-${i + 1}">
      <h2>${category}</h2>
      <div class="menu-items">
        ${Array.from({ length: dishesPerCategory[i] }, (_, dishIndex) => {
          const imageUrl = imageUrls[i * 10 + dishIndex]; // Access the correct URL index
          const price = pricesList[i * 10 + dishIndex]; // Access the correct price index
          const filter = filterMapping[i][dishIndex]; // Get the filter from filterMapping
          const dishName = dishNames[i * 10 + dishIndex]; // Correctly access the dish name
          const categoryDescription = categoryDescriptions[i * 10 + dishIndex]; // Correctly access the description

          return `
            <div class="menu-item" data-type="${filter}" data-id="${i}-${dishIndex}">
              <img src="${imageUrl}" alt="Dish ${dishIndex + 1}">
              <div class="item-description">
                <h3>${category} - ${dishName} - <span class="price">$${price.toFixed(2)}</span></h3>
                <p>${categoryDescription}</p>
                <button type="button" class="add-to-wishlist"><i class="fas fa-heart"></i>&#10084;</button>
                <button type="button" class="add-to-cart">Add to Cart</button>
              </div>
            </div>`;
        }).join('')}
      </div>
    </section>`;
});

document.getElementById('menu').innerHTML = dishes.join('');


        document.getElementById('menu').innerHTML = dishes.join('');
      </script>
    </div>
  </main>

  <!-- Wishlist Modal -->
  <div id="wishlist-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeWishlist">×</span>
      <h2>Wishlist</h2>
      <ul id="wishlist-items"></ul>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeCart">×</span>
      <h2>Cart</h2>
      <ul id="cart-items"></ul>
    </div>
  </div>

  <!-- Footer Section -->
  <footer>
    <p>© 2024 Restaurant Name | All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
